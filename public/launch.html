<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCT9 | Official Launch — 18 October</title>
  <meta name="description"
    content="OCT9 official launch on 18 October. Discover our curated collection of luxury pret, artisanal suits, and couture." />

  <!-- Google Fonts: Roboto (Material UI standard) + Cormorant Garamond & Playfair Display (Brand Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet" />

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <!-- Material UI (MUI v5) and React via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js" crossorigin></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js" crossorigin></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --color-brand-maroon: #881337;
      --color-brand-maroon-hover: #4C0519;
      --color-brand-gold: #D97706;
      --color-brand-gold-dark: #B45309;
      --color-brand-cream: #FAF7F2;
      --color-brand-dark: #1F2937;
      --font-serif: "Cormorant Garamond", "Playfair Display", Georgia, serif;
      --font-sans: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-brand-cream);
      color: var(--color-brand-dark);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .font-serif {
      font-family: var(--font-serif);
    }

    /* Fallback loader until React mounts */
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--font-serif);
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--color-brand-maroon);
    }
  </style>
</head>

<body>
  <div id="root">OCT9 &mdash; Launching 18 October</div>

  <script type="text/babel">
    const {
      ThemeProvider,
      createTheme,
      CssBaseline,
      Container,
      Box,
      Typography,
      Button,
      TextField,
      Snackbar,
      Alert,
      Divider,
      Grid,
      Link
    } = MaterialUI;

    // Custom MUI theme matching the OCT9 application palette
    const theme = createTheme({
      palette: {
        primary: {
          main: '#881337', // Brand Maroon
          dark: '#4C0519',
          contrastText: '#FFFFFF',
        },
        secondary: {
          main: '#D97706', // Brand Gold
          dark: '#B45309',
          contrastText: '#FFFFFF',
        },
        background: {
          default: '#FAF7F2',
          paper: '#FFFFFF',
        },
        text: {
          primary: '#1F2937',
          secondary: '#52525B',
        },
        divider: '#E4E4E7',
      },
      typography: {
        fontFamily: '"Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        h1: {
          fontFamily: '"Cormorant Garamond", "Playfair Display", Georgia, serif',
          fontWeight: 500,
          letterSpacing: '-0.02em',
        },
        h2: {
          fontFamily: '"Cormorant Garamond", "Playfair Display", Georgia, serif',
          fontWeight: 500,
          letterSpacing: '-0.01em',
        },
        h3: {
          fontFamily: '"Cormorant Garamond", "Playfair Display", Georgia, serif',
          fontWeight: 600,
        },
        overline: {
          letterSpacing: '0.25em',
          fontWeight: 600,
          color: '#881337',
        },
        button: {
          letterSpacing: '0.12em',
          fontWeight: 500,
          textTransform: 'uppercase',
        },
      },
      shape: {
        borderRadius: 2, // Crisp, understated editorial corners
      },
      components: {
        MuiButton: {
          styleOverrides: {
            root: {
              borderRadius: 2,
              padding: '12px 32px',
              fontSize: '0.8125rem',
              boxShadow: 'none',
              '&:hover': {
                boxShadow: 'none',
              },
            },
          },
        },
        MuiOutlinedInput: {
          styleOverrides: {
            root: {
              borderRadius: 2,
              backgroundColor: '#FFFFFF',
            },
          },
        },
      },
    });

    function LaunchAnnouncementPage() {
      // Launch target: 18 October (10:00 AM IST)
      const targetDate = new Date('2026-10-18T10:00:00+05:30').getTime();

      const calculateTimeLeft = () => {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference <= 0) {
          return { days: 0, hours: 0, minutes: 0, seconds: 0, completed: true };
        }

        return {
          days: Math.floor(difference / (1000 * 60 * 60 * 24)),
          hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
          minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
          seconds: Math.floor((difference % (1000 * 60)) / 1000),
          completed: false,
        };
      };

      const [timeLeft, setTimeLeft] = React.useState(calculateTimeLeft());
      const [email, setEmail] = React.useState('');
      const [openSnackbar, setOpenSnackbar] = React.useState(false);
      const [emailError, setEmailError] = React.useState('');

      React.useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(calculateTimeLeft());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const handleSubscribe = async (e) => {
        e.preventDefault();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          setEmailError('Please enter a valid email address');
          return;
        }
        setEmailError('');
        try {
          await fetch('/api/forms/launch-subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim() }),
          });
        } catch (err) {}
        setOpenSnackbar(true);
        setEmail('');
      };

      const timerUnits = [
        { label: 'Days', value: String(timeLeft.days).padStart(2, '0') },
        { label: 'Hours', value: String(timeLeft.hours).padStart(2, '0') },
        { label: 'Minutes', value: String(timeLeft.minutes).padStart(2, '0') },
        { label: 'Seconds', value: String(timeLeft.seconds).padStart(2, '0') },
      ];

      return (
        <Box sx={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', bgcolor: 'background.default' }}>
          {/* Top Announcement Bar */}
          <Box
            sx={{
              bgcolor: 'primary.main',
              color: '#FFFFFF',
              py: 1,
              px: { xs: 2, sm: 3 },
              borderBottom: '1px solid rgba(255,255,255,0.1)',
              textAlign: 'center',
            }}
          >
            <Typography variant="caption" sx={{ letterSpacing: '0.18em', textTransform: 'uppercase', fontSize: '0.75rem' }}>
              Official Announcement &bull; Autumn / Festive Collection Unveiling
            </Typography>
          </Box>

          {/* Editorial Brand Header */}
          <Box
            component="header"
            sx={{
              py: 3,
              px: 4,
              borderBottom: '1px solid',
              borderColor: 'divider',
              textAlign: 'center',
              bgcolor: 'background.default'
            }}
          >
            <Typography
              variant="h3"
              component="div"
              sx={{
                fontFamily: '"Cormorant Garamond", serif',
                letterSpacing: '0.35em',
                fontWeight: 700,
                color: 'primary.main',
                textTransform: 'uppercase'
              }}
            >
              OCT9
            </Typography>
            <Typography variant="caption" sx={{ letterSpacing: '0.28em', textTransform: 'uppercase', color: 'text.secondary', display: 'block', mt: 0.5 }}>
              Luxury Without Noise &bull; Artisanal Ethnic Pret
            </Typography>
          </Box>

          {/* Main Hero Section */}
          <Container maxWidth="md" sx={{ flex: 1, py: { xs: 6, md: 10 }, display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center' }}>
            <Typography variant="overline" display="block" gutterBottom>
              Mark Your Calendar
            </Typography>

            <Typography
              variant="h1"
              sx={{
                fontSize: { xs: '2.5rem', sm: '3.75rem', md: '4.5rem' },
                lineHeight: 1.1,
                mb: 2,
                color: 'text.primary',
              }}
            >
              The Grand Launch<br />
              <span style={{ color: '#881337', fontStyle: 'italic', fontFamily: '"Cormorant Garamond", serif' }}>
                18 October
              </span>
            </Typography>

            <Typography
              variant="body1"
              sx={{
                color: 'text.secondary',
                maxWidth: 580,
                mb: 6,
                fontSize: { xs: '0.95rem', md: '1.05rem' },
                lineHeight: 1.7,
              }}
            >
              We are preparing an exclusive curation of hand-embroidered silhouettes, timeless festive ensembles, and modern ethnic pret. Experience the unveiling on 18 October.
            </Typography>

            {/* Countdown Timer with Clean Editorial Columns */}
            <Box
              sx={{
                width: '100%',
                maxWidth: 640,
                borderTop: '1px solid',
                borderBottom: '1px solid',
                borderColor: 'divider',
                py: { xs: 3, md: 4 },
                mb: 6,
              }}
            >
              <Grid container spacing={2} justifyContent="center" alignItems="center">
                {timerUnits.map((item, idx) => (
                  <Grid item xs={3} key={item.label}>
                    <Box sx={{ textAlign: 'center' }}>
                      <Typography
                        variant="h2"
                        sx={{
                          fontSize: { xs: '2rem', sm: '3.25rem', md: '3.75rem' },
                          color: 'primary.main',
                          lineHeight: 1,
                          fontWeight: 600,
                        }}
                      >
                        {item.value}
                      </Typography>
                      <Typography
                        variant="caption"
                        sx={{
                          textTransform: 'uppercase',
                          letterSpacing: '0.2em',
                          color: 'text.secondary',
                          fontSize: '0.7rem',
                          display: 'block',
                          mt: 1,
                          fontWeight: 500,
                        }}
                      >
                        {item.label}
                      </Typography>
                    </Box>
                  </Grid>
                ))}
              </Grid>
            </Box>

            {/* Early Access / VIP Notification Form */}
            <Box
              component="form"
              onSubmit={handleSubscribe}
              sx={{
                width: '100%',
                maxWidth: 480,
                textAlign: 'center',
              }}
            >
              <Typography
                variant="subtitle2"
                sx={{
                  letterSpacing: '0.1em',
                  textTransform: 'uppercase',
                  fontSize: '0.8rem',
                  mb: 1,
                  color: 'text.primary',
                }}
              >
                Request VIP Early Access
              </Typography>
              <Typography variant="body2" sx={{ color: 'text.secondary', mb: 2.5, fontSize: '0.85rem' }}>
                Receive our launch day catalog and an exclusive privilege code one hour prior to public opening.
              </Typography>

              <Box sx={{ display: 'flex', flexDirection: { xs: 'column', sm: 'row' }, gap: 1.5 }}>
                <TextField
                  fullWidth
                  size="small"
                  placeholder="Enter your email address"
                  variant="outlined"
                  value={email}
                  onChange={(e) => {
                    setEmail(e.target.value);
                    if (emailError) setEmailError('');
                  }}
                  error={Boolean(emailError)}
                  helperText={emailError}
                  sx={{
                    '& .MuiOutlinedInput-root': {
                      fontSize: '0.875rem',
                    },
                  }}
                />
                <Button
                  type="submit"
                  variant="contained"
                  color="primary"
                  sx={{
                    whiteSpace: 'nowrap',
                    px: 3,
                    py: 1.25,
                  }}
                >
                  Notify Me
                </Button>
              </Box>
            </Box>

            {/* Highlighted Launch Categories */}
            <Box sx={{ mt: 8, pt: 4, borderTop: '1px solid', borderColor: 'divider', width: '100%', maxWidth: 700 }}>
              <Typography
                variant="caption"
                sx={{ letterSpacing: '0.2em', textTransform: 'uppercase', color: 'text.secondary', display: 'block', mb: 2 }}
              >
                Curations Premiering On Launch Day
              </Typography>

              <Grid container spacing={2} justifyContent="center">
                {['Stitched Suits', 'Festive Anarkalis', 'Artisanal Sarees', 'Occasion Pret'].map((cat) => (
                  <Grid item xs={6} sm={3} key={cat}>
                    <Box
                      sx={{
                        py: 1.5,
                        px: 1,
                        border: '1px solid',
                        borderColor: 'divider',
                        bgcolor: '#FFFFFF',
                        textAlign: 'center',
                      }}
                    >
                      <Typography variant="body2" sx={{ fontSize: '0.8rem', fontWeight: 500, color: 'text.primary' }}>
                        {cat}
                      </Typography>
                    </Box>
                  </Grid>
                ))}
              </Grid>
            </Box>
          </Container>

          {/* Minimal Editorial Footer */}
          <Box
            component="footer"
            sx={{
              borderTop: '1px solid',
              borderColor: 'divider',
              py: 4,
              px: 3,
              textAlign: 'center',
              bgcolor: '#FAF7F2',
            }}
          >
            <Typography variant="body2" sx={{ fontSize: '0.8rem', color: 'text.secondary', mb: 1 }}>
              Questions or bespoke inquiries? Contact{' '}
              <Link
                href="mailto:care@oct9.com"
                sx={{
                  color: 'primary.main',
                  fontWeight: 500,
                  textDecoration: 'none',
                  '&:hover': { textDecoration: 'underline' },
                }}
              >
                Customer Support (care@oct9.com)
              </Link>
            </Typography>

            <Typography variant="caption" sx={{ color: 'text.secondary', display: 'block' }}>
              &copy; {new Date().getFullYear()} OCT9. All Rights Reserved. Official Launch: 18 October.
              {' '}&bull;{' '}
              <Link
                href="/login"
                sx={{
                  color: 'primary.main',
                  textDecoration: 'none',
                  fontWeight: 500,
                  '&:hover': { textDecoration: 'underline' }
                }}
              >
                Admin Login
              </Link>
            </Typography>
          </Box>

          {/* MUI Notification Snackbar */}
          <Snackbar
            open={openSnackbar}
            autoHideDuration={5000}
            onClose={() => setOpenSnackbar(false)}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }}
          >
            <Alert
              onClose={() => setOpenSnackbar(false)}
              severity="success"
              variant="filled"
              sx={{ bgcolor: 'primary.main', color: '#FFFFFF', borderRadius: 1 }}
            >
              Thank you. You have been added to our 18 October VIP launch list.
            </Alert>
          </Snackbar>
        </Box>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ThemeProvider theme={theme}>
        <CssBaseline />
        <LaunchAnnouncementPage />
      </ThemeProvider>
    );
  </script>
</body>

</html>
